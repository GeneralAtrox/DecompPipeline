<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decomp Progress</title>
<style>
:root{--bg:#0b0f17;--panel:#121826;--line:#263042;--text:#e6e9ef;--dim:#8a93a6;--readable:#2fbf5b;--matched:#1d7f3c;
--progress:#3b7fd9;--blocked:#c98a2b;--todo:#1a2130;--done:#2fbf5b;--now:#3b7fd9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,Segoe UI,sans-serif}
main{max-width:1200px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:20px;margin:0 0 2px}h2{font-size:15px;margin:22px 0 10px;color:var(--dim);font-weight:600;letter-spacing:.02em}
.sub{color:var(--dim);font-size:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.game-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.game-head b{font-size:16px}.pct{color:var(--dim);font-size:12px}
.road{display:flex;gap:4px;margin:10px 0 8px;flex-wrap:wrap}
.step{flex:1 1 90px;min-width:90px;border-radius:7px;padding:6px 8px;background:#0e1420;border:1px solid var(--line);font-size:12px}
.step .n{display:block;font-weight:600}.step .v{color:var(--dim);font-size:11px}
.step.done{border-color:#1f6b38;background:#0f2418}.step.done .n:before{content:"\2713  ";color:var(--done)}
.step.now{border-color:var(--now);background:#0f1d33;box-shadow:0 0 0 1px var(--now) inset}.step.now .n:before{content:"\25B6  ";color:var(--now)}
.step.part{border-color:#6b5a1f;background:#1d1a10}.step.part .n:before{content:"\25D0  ";color:#e7b56a}
.meter{display:block;height:4px;background:#1a2130;border-radius:2px;margin-top:4px;overflow:hidden}
.meter i{display:block;height:100%;background:#e7b56a}.step.now .meter i{background:var(--now)}
.now-line{margin:4px 0}.now-line b{color:#9cc3ff}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--dim)}
.chip.bug{border-color:#6b4a1f;color:#e7b56a}.chip.wait{border-color:#2b4f86;color:#9cc3ff}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:7px 8px;border-top:1px solid var(--line);vertical-align:top}
th{color:var(--dim);font-weight:600;border-top:0}
.st{font-size:11px;border-radius:999px;padding:1px 8px;white-space:nowrap}
.st.running{background:#0f1d33;color:#9cc3ff}.st.waiting{background:#2a2111;color:#e7b56a}.st.done{background:#0f2418;color:#7fe0a0}
.st.queued{background:#1a2130;color:var(--dim)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
select,input{background:#0b0f17;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
input{flex:1;min-width:200px}
#tm{width:100%;height:520px;display:block;border-radius:10px;background:#070a10;cursor:pointer}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--dim);align-items:center}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px}
#tip{position:fixed;pointer-events:none;background:#0b0f17;border:1px solid var(--line);border-radius:8px;padding:8px 10px;
font-size:12px;display:none;max-width:340px;z-index:5}
#crumb{font-size:12px;color:var(--dim);margin-bottom:6px}#crumb a{color:#9cc3ff;cursor:pointer}
.empty{color:var(--dim);font-size:13px}
@media (max-width:640px){#tm{height:380px}.step{flex-basis:44%}}
</style>
</head>
<body>
<main>
<h1>Decomp Progress</h1>
<div class="sub" id="made"></div>

<h2>GAMES: DISC TO NATIVE PORT</h2>
<div class="legend" style="margin:-4px 0 10px"><span>&#10003; done</span><span>&#9654; being worked on</span><span>&#9680; still finishing</span></div>
<div id="games"></div>

<h2>WORK IN PROGRESS</h2>
<div class="panel" id="work"></div>

<h2>FUNCTIONS BY UNIT</h2>
<div class="panel">
  <div class="bar"><select id="scope"></select><input id="q" placeholder="Filter: unit name, address, >10kb, <70%"></div>
  <div id="crumb"></div>
  <canvas id="tm"></canvas>
  <div class="legend" id="legend"></div>
</div>
<div id="tip"></div>
</main>
<script>
const D = /*DATA*/null;
const COL = {readable:"--readable", matched:"--matched", progress:"--progress", blocked:"--blocked", todo:"--todo"};
const LABEL = {readable:"Readable C", matched:"Raw C proven", progress:"In progress", blocked:"Refused (needs a fix)", todo:"Not started"};
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct = (a, b) => b ? Math.round(1000 * a / b) / 10 : 0;
document.getElementById("made").textContent =
  `Made ${D.made} from the workspaces on this machine. Run Dashboard.bat again to refresh.`;

/* ---- games and their road ---- */
function gameRows() {
  const g = {};
  for (const w of D.games) {
    const k = w.game; g[k] = g[k] || {name: k, console: w.console, parts: [], progress: w.progress};
    g[k].parts.push(w);
  }
  return Object.values(g);
}
function road(G) {
  let fns = 0, harn = 0, raw = 0, rd = 0, bytes = 0;
  for (const p of G.parts) {
    for (const s of D.states) { fns += p.counts[s][0]; bytes += p.counts[s][1]; }
    harn += p.harnesses; raw += p.counts.readable[0] + p.counts.matched[0]; rd += p.counts.readable[0];
  }
  const m = (G.progress || {}).milestones || {}, share = (a, b) => Math.min(100, pct(a, b));
  const steps = [
    ["Disc", "extracted", true],
    ["Functions", fns.toLocaleString() + " found", fns > 0],
    ["Tests", share(harn, fns) + "% built", fns > 0 && harn >= fns, share(harn, fns)],
    ["Raw C", share(raw, fns) + "% proven", fns > 0 && raw >= fns, share(raw, fns)],
    ["Readable C", share(rd, fns) + "% done", fns > 0 && rd >= fns, share(rd, fns)],
    ["Port builds", m.builds || (G.parts.some(p => p.port) ? "set up" : "-"), !!m.builds],
    ["Boots", m.boots || "-", !!m.boots],
    ["Playable", m.playable || "-", !!m.playable],
    ["Matches original", m.matches || "-", !!m.matches]];
  // the step being worked on: the one after the furthest step reached (earlier steps may still be finishing)
  let last = -1; steps.forEach((s, i) => { if (s[2]) last = i; });
  return {steps, cur: last + 1, fns, raw, rd};
}
function renderGames() {
  const box = document.getElementById("games"), rows = gameRows();
  if (!rows.length) { box.innerHTML = '<div class="panel empty">No workspaces found under the console roots.</div>'; return; }
  box.innerHTML = rows.map(G => {
    const r = road(G), P = G.progress || {}, bugs = (P.bugs || []).filter(b => b.state !== "fixed");
    const waits = D.work.filter(w => w.state !== "done" && (w.games || []).includes(G.name));
    return `<div class="panel"><div class="game-head"><b>${esc(G.name)}</b>
      <span class="pct">${esc(G.console)} · ${G.parts.length} workspace(s) · data from ${esc(G.parts.map(p => p.updated).sort().pop())}</span></div>
      <div class="road">${r.steps.map((s, i) => `<div class="step ${s[2] ? "done" : i === r.cur ? "now" : i < r.cur ? "part" : ""}">
        <span class="n">${s[0]}</span><span class="v">${esc(s[1])}</span>
        ${s[3] !== undefined && !s[2] ? `<span class="meter"><i style="width:${s[3]}%"></i></span>` : ""}</div>`).join("")}</div>
      ${P.now ? `<div class="now-line"><b>Now:</b> ${esc(P.now)}</div>` : ""}
      ${P.next ? `<div class="now-line sub">Next: ${esc(P.next)}</div>` : ""}
      <div class="chips">${waits.map(w => `<span class="chip wait">waits on: ${esc(w.name)}</span>`).join("")}
        ${bugs.map(b => `<span class="chip bug">${esc(b.id)}: ${esc(b.text)}</span>`).join("")}</div></div>`;
  }).join("");
}
function renderWork() {
  const box = document.getElementById("work");
  if (!D.work.length) { box.innerHTML = '<div class="empty">No work board found (config key "board").</div>'; return; }
  const order = {running: 0, waiting: 1, queued: 2, done: 3};
  const rows = [...D.work].sort((a, b) => (order[a.state] ?? 9) - (order[b.state] ?? 9));
  box.innerHTML = `<div class="sub" style="margin-bottom:6px">Board updated ${esc(D.board_updated || "?")}</div>
    <table><tr><th>Work</th><th>What it does</th><th>State</th><th>Where</th><th>Unblocks</th></tr>${rows.map(w =>
    `<tr><td><b>${esc(w.name)}</b>${w.started ? `<div class="sub">since ${esc(w.started)}</div>` : ""}</td>
     <td>${esc(w.what)}${w.result ? `<div class="sub">${esc(w.result)}</div>` : ""}</td>
     <td><span class="st ${esc(w.state)}">${esc(w.state)}</span></td><td>${esc(w.where || "")}</td>
     <td>${esc((w.unblocks || "") + ((w.games || []).length ? " (" + w.games.join(", ") + ")" : ""))}</td></tr>`).join("")}</table>`;
}

/* ---- treemap ---- */
function squarify(items, x, y, w, h) {   // items: [{v, ...}] sorted desc; returns [{item, x, y, w, h}]
  const out = [], total = items.reduce((s, i) => s + i.v, 0);
  if (!total || w <= 0 || h <= 0) return out;
  const scale = w * h / total; let rest = items.map(i => ({i, a: i.v * scale}));
  while (rest.length) {
    const side = Math.min(w, h); let row = [rest[0]], best = worst(row, side), k = 1;
    while (k < rest.length) { const t = worst([...row, rest[k]], side); if (t > best) break; row.push(rest[k]); best = t; k++; }
    const sum = row.reduce((s, r) => s + r.a, 0), thick = sum / side; let off = 0;
    for (const r of row) {
      const len = r.a / thick;
      out.push(w >= h ? {item: r.i, x, y: y + off, w: thick, h: len} : {item: r.i, x: x + off, y, w: len, h: thick});
      off += len;
    }
    if (w >= h) { x += thick; w -= thick; } else { y += thick; h -= thick; }
    rest = rest.slice(k);
  }
  return out;
}
function worst(row, side) {
  const s = row.reduce((a, r) => a + r.a, 0), mx = Math.max(...row.map(r => r.a)), mn = Math.min(...row.map(r => r.a));
  return Math.max(side * side * mx / (s * s), s * s / (side * side * mn));
}
let VIEW = {scope: "all", unit: null}, HITS = [];
function units() {   // [{game, part, name, fns}] in the current scope
  const out = [];
  for (const w of D.games) {
    const key = w.game + " / " + w.part;
    if (VIEW.scope !== "all" && VIEW.scope !== w.game && VIEW.scope !== key) continue;
    for (const [name, fns] of w.units) out.push({game: w.game, part: w.part, name, fns});
  }
  return VIEW.unit ? out.filter(u => u.game + u.part + u.name === VIEW.unit) : out;
}
function matches(u) {
  const q = document.getElementById("q").value.trim().toLowerCase(); if (!q) return true;
  const bytes = u.fns.reduce((s, f) => s + f[1], 0), done = u.fns.filter(f => f[2] <= 1).reduce((s, f) => s + f[1], 0);
  return q.split(/\s+/).every(t => {
    let m = t.match(/^([<>])(\d+(?:\.\d+)?)%$/); if (m) return m[1] === "<" ? pct(done, bytes) < +m[2] : pct(done, bytes) > +m[2];
    m = t.match(/^([<>])(\d+(?:\.\d+)?)kb$/); if (m) return m[1] === "<" ? bytes < m[2] * 1024 : bytes > m[2] * 1024;
    return (u.name + " " + u.game + " " + u.part).toLowerCase().includes(t) || u.fns.some(f => f[0].includes(t));
  });
}
function draw() {
  const cv = document.getElementById("tm"), r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  cv.width = r.width * dpr; cv.height = r.height * dpr;
  const c = cv.getContext("2d"); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, r.width, r.height);
  const us = units().map(u => ({...u, v: u.fns.reduce((s, f) => s + f[1], 0)})).filter(u => u.v).sort((a, b) => b.v - a.v);
  const colors = D.states.map(s => css(COL[s])); HITS = [];
  for (const R of squarify(us, 0, 0, r.width, r.height)) {
    const u = R.item, on = matches(u), pad = R.w > 8 && R.h > 8 ? 1.5 : 0;
    const fr = squarify([...u.fns].map(f => ({v: f[1], f})).sort((a, b) => b.v - a.v), R.x + pad, R.y + pad, R.w - 2 * pad, R.h - 2 * pad);
    for (const F of fr) {
      c.globalAlpha = on ? 1 : .18; c.fillStyle = colors[F.item.f[2]];
      c.fillRect(F.x + .25, F.y + .25, Math.max(F.w - .5, .5), Math.max(F.h - .5, .5));
      HITS.push({...F, u});
    }
    c.globalAlpha = 1; c.strokeStyle = "#f2f4f8"; c.lineWidth = 1; c.strokeRect(R.x + .5, R.y + .5, R.w - 1, R.h - 1);
  }
  const all = us.flatMap(u => u.fns), b = all.reduce((s, f) => s + f[1], 0);
  document.getElementById("legend").innerHTML = D.states.map((s, i) => {
    const n = all.filter(f => f[2] === i); return `<span><i style="background:${colors[i]}"></i>${LABEL[s]} ${n.length.toLocaleString()}</span>`;
  }).join("") + `<span style="margin-left:auto">${us.length} units · ${(b / 1048576).toFixed(2)} MB</span>`;
  document.getElementById("crumb").innerHTML = VIEW.unit ? `<a id="back">&larr; all units</a> / ${esc(us[0]?.name || "")}` : "Point at a unit for details; select it to open";
  const back = document.getElementById("back"); if (back) back.onclick = () => { VIEW.unit = null; draw(); };
}
function hit(e) {
  const r = e.target.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  return HITS.find(h => x >= h.x && x < h.x + h.w && y >= h.y && y < h.y + h.h);
}
function setup() {
  const sel = document.getElementById("scope");
  const opts = [["all", "All games"]];
  for (const G of gameRows()) { opts.push([G.name, G.name]); if (G.parts.length > 1) for (const p of G.parts) opts.push([G.name + " / " + p.part, "  " + G.name + " / " + p.part]); }
  sel.innerHTML = opts.map(o => `<option value="${esc(o[0])}">${esc(o[1])}</option>`).join("");
  sel.onchange = () => { VIEW = {scope: sel.value, unit: null}; draw(); };
  document.getElementById("q").oninput = draw;
  const cv = document.getElementById("tm"), tip = document.getElementById("tip");
  cv.onmousemove = e => {
    const h = hit(e); if (!h) { tip.style.display = "none"; return; }
    const f = h.item.f, u = h.u, ub = u.fns.reduce((s, g) => s + g[1], 0), ud = u.fns.filter(g => g[2] <= 1).reduce((s, g) => s + g[1], 0);
    tip.innerHTML = `<b>${esc(u.name)}</b> <span class="sub">${esc(u.game)} / ${esc(u.part)}</span><br>${u.fns.length} functions · ${(ub / 1024).toFixed(1)} KB · ${pct(ud, ub)}% proven<br><br>
      <b>${esc(f[0])}</b> · ${f[1]} bytes · ${LABEL[D.states[f[2]]]}${f[3] ? " · " + esc(f[3]) : ""}`;
    tip.style.display = "block"; tip.style.left = Math.min(e.clientX + 14, innerWidth - 350) + "px"; tip.style.top = (e.clientY + 14) + "px";
  };
  cv.onmouseleave = () => tip.style.display = "none";
  cv.onclick = e => { const h = hit(e); if (h && !VIEW.unit) { VIEW.unit = h.u.game + h.u.part + h.u.name; draw(); } };
  addEventListener("resize", draw);
}
renderGames(); renderWork(); setup(); draw();
</script>
</body>
</html>
